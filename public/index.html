<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>IDC Case Portal L-1A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B6B1B'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3EIDC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Điều hướng">
    <div class="brand"><div class="logo">IDC</div><div><b>IDC VIETNAM</b><span>Cổng hồ sơ định cư</span></div></div>
    <div><div class="navlabel">Không gian làm việc</div><nav class="nav" id="nav-main"></nav></div>
    <div><div class="navlabel">Chương trình</div><nav class="nav" id="nav-prog"></nav></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <div class="mobile-nav" id="nav-mobile"></div>
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <label class="search" for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm khách hàng, mã hồ sơ, tài liệu…" autocomplete="off"></label>
      <button type="button" class="olpill" id="olpill" data-go="admin" hidden><i aria-hidden="true"></i><span id="olpill-t"></span></button><div class="bellwrap" id="bellwrap"><button type="button" id="bell" aria-label="Thông báo" aria-haspopup="true" aria-expanded="false" aria-controls="bell-panel" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bell-n" hidden></span></button><div class="bell-panel" id="bell-panel" role="region" aria-label="Thông báo" hidden></div></div>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div style="min-width:0"><div class="eyebrow" id="dr-eb"></div><h3 id="dr-title"></h3></div><div class="sp" id="dr-acts"></div></div>
  <div class="db" id="dr-body"></div>
</aside>
<input type="file" id="file" hidden multiple accept="application/pdf,image/png,image/jpeg,image/webp,.pdf,.png,.jpg,.jpeg,.webp">
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
</body>
</html>
