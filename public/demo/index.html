<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>IDC Case Portal · Xem thử</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B6B1B'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3EIDC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>.demo-pill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:999px;background:#0F172A;color:#F8FAFC;font:500 12.5px/1.35 "Be Vietnam Pro",system-ui,sans-serif;box-shadow:0 1px 2px rgba(15,23,42,.2),0 8px 24px rgba(15,23,42,.18)}.demo-pill i{width:8px;height:8px;border-radius:50%;background:#F5B700;flex:none}</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Điều hướng">
    <div class="brand"><div class="logo">IDC</div><div><b>IDC VIETNAM</b><span>Cổng hồ sơ định cư</span></div></div>
    <div><div class="navlabel">Không gian làm việc</div><nav class="nav" id="nav-main"></nav></div>
    <div><div class="navlabel">Chương trình</div><nav class="nav" id="nav-prog"></nav></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <div class="mobile-nav" id="nav-mobile"></div>
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <label class="search" for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm khách hàng, mã hồ sơ, tài liệu…" autocomplete="off"></label>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div style="min-width:0"><div class="eyebrow" id="dr-eb"></div><h3 id="dr-title"></h3></div><div class="sp" id="dr-acts"></div></div>
  <div class="db" id="dr-body"></div>
</aside>
<input type="file" id="file" hidden multiple accept="application/pdf,image/png,image/jpeg,image/webp,.pdf,.png,.jpg,.jpeg,.webp">
<div class="demo-pill" role="note"><i></i><span>Bản xem thử · dữ liệu giả lập, thao tác không được lưu</span></div>
<div class="toast" id="toast" role="status"></div>
<script src="/demo/mock.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
