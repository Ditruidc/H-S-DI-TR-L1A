# Giữ Supabase (gói Free) luôn hoạt động: mỗi ngày gửi 1 truy vấn nhỏ.
# Supabase tạm dừng project nếu 7 ngày liền không có hoạt động.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 1 * * *'   # 08:17 sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" public/config.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" public/config.js | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase trả về HTTP $code"
          test "$code" = "200"
